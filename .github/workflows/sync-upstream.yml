name: Sync translation with upstream

# Keeps the Ukrainian translation in step with laravel/docs.
#
# Each page records the upstream commit it was translated from in its `git:`
# header, so the gap is derived from the files themselves. Small routine edits
# are translated and opened as a pull request for review; anything large, and
# any page that does not exist here yet, is reported as an issue instead - a
# new section wants a person, and paying for it by the token does not.
#
# Requires a repo secret ANTHROPIC_API_KEY. The default GITHUB_TOKEN is enough
# for the branch, the pull request and the issue.

on:
  schedule:
    - cron: '43 5 * * *' # daily, 05:43 UTC
  workflow_dispatch:
    inputs:
      max_lines:
        description: 'Total changed lines above which the run defers to a person'
        required: false
        default: '400'
      max_file_lines:
        description: 'Per-file changed lines above which a page waits for a person'
        required: false
        default: '150'

permissions: {}

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the diff runs between the commit the translation was
          # made from and upstream's head, and both may be far back.
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/laravel/docs.git
          git fetch --quiet upstream 13.x

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Ahead of the measurement, and unconditionally: this one guards the
      # decision the measurement is about to make, so gating it on the verdict
      # would skip it in exactly the case it exists to catch - a run that
      # wrongly concludes it has nothing to translate.
      - name: Check an over-budget run still clears what it can
        run: python3 scripts/tests/test_select.py

      - name: Measure the gap
        id: status
        run: |
          python3 scripts/upstream_status.py \
            --max-lines "${{ inputs.max_lines || 400 }}" \
            --max-file-lines "${{ inputs.max_file_lines || 150 }}"

      - name: Check section boundaries round-trip
        if: steps.status.outputs.status == 'translate'
        run: python3 scripts/tests/test_restore_edges.py

      - name: Check the rebuild keeps upstream's sections
        if: steps.status.outputs.status == 'translate'
        run: python3 scripts/tests/test_rebuild.py

      - name: Check a bad page is retried and does not sink the run
        if: steps.status.outputs.status == 'translate'
        run: python3 scripts/tests/test_retry_and_defer.py

      - name: Check untouched lines are not restyled
        if: steps.status.outputs.status == 'translate'
        run: python3 scripts/tests/test_keep_untouched_lines.py


      - name: Install the SDK
        if: steps.status.outputs.status == 'translate'
        run: pip install --quiet anthropic

      - name: Translate the changed sections
        id: translate
        if: steps.status.outputs.status == 'translate'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 scripts/translate_diff.py ${{ steps.status.outputs.files }} \
            --base "${{ steps.status.outputs.base }}" \
            --head "${{ steps.status.outputs.head }}"

      - name: Open a pull request
        if: steps.status.outputs.status == 'translate'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD: ${{ steps.status.outputs.head }}
          HELD: ${{ steps.status.outputs.oversized }}
          OVER_BUDGET: ${{ steps.status.outputs.over_budget }}
          REJECTED: ${{ steps.translate.outputs.rejected }}
        run: |
          if git diff --quiet; then
            echo 'Nothing changed - the sections were already up to date.'
            exit 0
          fi

          branch="sync/upstream-${HEAD:0:8}"

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          # The branch name is derived from the upstream commit, so while
          # upstream sits still every run aims at the same branch - and one is
          # already there from the run that first reached this commit. Starting
          # it afresh from 13.x and pushing rejected the push as non-fast-forward,
          # which failed the whole step: the translations that run had just
          # produced were thrown away, and the pages that had been retried
          # stayed behind. Runs #16 and #17 (8 and 9 August) were both lost this
          # way, which is how installation.md fell behind the rest.
          #
          # So continue the existing branch when there is one: its commits are
          # the earlier attempt at this same upstream commit, and today's retry
          # belongs on top of them.
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git stash --include-untracked --quiet
            git fetch --quiet origin "$branch"
            git checkout --quiet -B "$branch" "origin/$branch"
            git stash pop --quiet
          else
            git checkout -b "$branch"
          fi

          git add -- '*.md'

          # Re-running against a branch that already carries today's work leaves
          # nothing to commit; that is success, not a failure to report.
          if git diff --cached --quiet; then
            echo 'The branch is already up to date with this run.'
            exit 0
          fi

          git commit -m "chore(docs): підтягнути зміни апстріму ${HEAD:0:8}"
          git push --quiet origin "$branch"

          {
            echo "Автоматичний переклад змін з [laravel/docs@${HEAD:0:8}](https://github.com/laravel/docs/commit/$HEAD)."
            echo
            # The files actually committed, rather than everything the run set
            # out to do: a page that failed validation is not in the branch.
            echo "Оновлено: $(git diff --name-only HEAD~1 | tr '\n' ' ')"
            echo
            if [ -n "$HELD" ]; then
              echo "> Відкладено як завеликі для автоматики: $HELD"
              echo
            fi
            if [ -n "$OVER_BUDGET" ]; then
              echo "> Не влізли в бюджет прогону і чекають наступного: $OVER_BUDGET"
              echo
            fi
            if [ -n "$REJECTED" ]; then
              echo "> Не пройшли структурну перевірку навіть після повтору"
              echo "> і лишилися без змін: $REJECTED"
              echo '>'
              echo '> Заголовок `git:` у них старий, тому наступний запуск'
              echo '> спробує ще раз - або перекладіть їх вручну.'
              echo
            fi
            echo 'Перекладено лише ті секції, яких торкнувся diff; решта сторінок не змінювалася.'
            echo 'Структуру перевірено автоматично (кількість рядків, якорі, блоки коду), але текст потребує вичитки.'
          } > /tmp/body.md

          # --repo is required because this is a fork of laravel/docs: without
          # it gh targets the upstream repository, where the token has no
          # access, and fails with "Resource not accessible by integration".
          #
          # A pull request may already exist for this branch, for the same
          # reason the branch did: creating a second one is an error, so the
          # open one is brought up to date with what this run added instead.
          open=$(gh pr list --repo "${GITHUB_REPOSITORY}" \
            --state open --head "$branch" \
            --json number --jq '.[0].number // empty')

          if [ -n "$open" ]; then
            gh pr edit "$open" --repo "${GITHUB_REPOSITORY}" \
              --title "Підтягнути зміни апстріму ${HEAD:0:8}" \
              --body-file /tmp/body.md
            echo "Updated pull request #$open."
            exit 0
          fi

          gh pr create \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Підтягнути зміни апстріму ${HEAD:0:8}" \
            --body-file /tmp/body.md \
            --base 13.x \
            --head "$branch"

      # Also runs on rejected pages, which the status step cannot know about:
      # they are only discovered when translation has already failed twice.
      # Without this they were named in the pull request body and nowhere else,
      # and ai-sdk.md and installation.md sat unnoticed across three syncs.
      - name: Report what needs a person
        if: steps.status.outputs.needs_person == 'true' || steps.translate.outputs.rejected != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD: ${{ steps.status.outputs.head }}
          BASE: ${{ steps.status.outputs.base }}
          HELD: ${{ steps.status.outputs.oversized }}
          NEW_PAGES: ${{ steps.status.outputs.new_pages }}
          REJECTED: ${{ steps.translate.outputs.rejected }}
          REASON: ${{ steps.status.outputs.reason }}
          LABEL: upstream-manual
        run: |
          title="Апстрім потребує ручного перекладу (${HEAD:0:8})"

          # One open issue at a time. The label is what makes that work: the
          # title carries the upstream SHA, so matching on it found nothing as
          # soon as upstream moved and filed a near-duplicate every morning
          # while the page waited for a person. The label does not change.
          #
          # --repo for the same reason as the pull request above: on a fork,
          # gh otherwise queries laravel/docs.
          gh label create "$LABEL" --repo "${GITHUB_REPOSITORY}" \
            --description 'Сторінки апстріму, які чекають на людину' \
            --color 'D93F0B' 2>/dev/null || true

          open=$(gh issue list --repo "${GITHUB_REPOSITORY}" \
            --state open --label "$LABEL" \
            --json number --jq '.[0].number // empty')

          {
            echo "[Diff апстріму](https://github.com/laravel/docs/compare/$BASE...$HEAD)"
            echo

            if [ -n "$HELD" ]; then
              echo 'Завеликі для автоматики:'
              echo
              printf -- '- %s\n' $HELD
              echo
            fi

            if [ -n "$NEW_PAGES" ]; then
              echo 'Нові сторінки (потрібні slug, заголовок і місце в бічній панелі):'
              echo
              printf -- '- %s\n' $NEW_PAGES
              echo
            fi

            if [ -n "$REJECTED" ]; then
              echo 'Не пройшли структурну перевірку навіть після повтору - автоматика'
              echo 'їх не подужала, потрібен ручний переклад:'
              echo
              printf -- '- %s\n' $REJECTED
              echo
            fi


            echo "_${REASON}_"
          } > /tmp/issue.md

          # An issue already open is rewritten rather than left to go stale:
          # the work is the same work, but the diff link and the file list have
          # moved on with upstream, and a person reading it wants today's.
          if [ -n "$open" ]; then
            gh issue edit "$open" --repo "${GITHUB_REPOSITORY}" \
              --title "$title" --body-file /tmp/issue.md
            echo "Updated issue #$open."
            exit 0
          fi

          gh issue create --repo "${GITHUB_REPOSITORY}" \
            --title "$title" --body-file /tmp/issue.md --label "$LABEL"
